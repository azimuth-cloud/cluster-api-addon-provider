# Configuration for the operator
# For available options, see capi_addons/config.py
# The vast majority of cases will not need to specify any configuration
config: {}

# A bundle of trusted CAs to use instead of the defaults
trustBundle:

# The operator image to use
image:
  repository: ghcr.io/azimuth-cloud/cluster-api-addon-provider
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

imagePullSecrets: []

# Pod-level security context
podSecurityContext:
  runAsNonRoot: true

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

# Resources for the operator container
# The operator is a single-replica kopf controller that shells out to the Helm
# CLI, producing transient CPU/memory spikes during reconciliation. Requests
# cover the steady-state baseline; a memory limit guards against runaway usage,
# while no CPU limit is set to avoid throttling reconciliation bursts.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Scheduling parameters for the operator pod
nodeSelector: {}
tolerations: []
affinity: {}
