[project]
name = "capi_addons"
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
version = "0.1.0"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.4",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "click==8.3.1",
    "configomatic==0.4.0",
    "easykube==0.6.0",
    "exceptiongroup==1.3.1",
    "frozenlist==1.8.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.15",
    "iso8601==2.1.0",
    "Jinja2==3.1.6",
    "kopf==1.44.4",
    "kube-custom-resource==0.6.1",
    "MarkupSafe==3.0.3",
    "multidict==6.7.1",
    "propcache==0.4.1",
    "pydantic==2.12.5",
    "pyhelm3==0.5.5-rc1",
    "python-json-logger==4.1.0",
    "PyYAML==6.0.3",
    "sniffio==1.3.1",
    "typing_extensions==4.15.0",
    "yarl==1.23.0"
]

[dependency-groups]
dev = [
    "ruff~=0.16.1",
    "codespell",
    "types-PyYAML",
    "types-setuptools",
    "mypy",
    "black~=26.5.1",
    "tox>=4.60.0",
    "tox-uv>=1.36.0",
    "pytest-cov",
]

[build-system]
requires = [
    "hatchling>=1.27"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/uv.lock",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = [
    "UP038", # deprecated
    "UP017", # remove and fix once 3.10 no longer tested in CI
]

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 15
